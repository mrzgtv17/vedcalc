[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vedcalc"
version = "0.15.0"
description = "Калькулятор ВЭД: себестоимость импорта и цена продажи B2B"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary. All rights reserved." }
dependencies = ["certifi>=2024.2.2"]

[project.optional-dependencies]
gui = ["PySide6>=6.7", "openpyxl>=3.1", "python-docx>=1.1", "keyring>=25"]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6.6"]

[project.scripts]
vedcalc = "vedcalc.gui.app:main"

[tool.setuptools.packages.find]
include = ["vedcalc*"]

[tool.setuptools.package-data]
"vedcalc.data" = ["*.json"]
"vedcalc.gui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Кириллица в строках и комментариях — норма для проекта.
ignore = ["RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
# Строки Qt Style Sheets читаются лучше целиком
"vedcalc/gui/theme.py" = ["E501"]
